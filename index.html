
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FACTORY WORLD</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:white;font-family:Arial,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{display:block;touch-action:none}
button{background:#203744;color:white;border:1px solid #68818e;border-radius:8px;padding:10px 12px;font-size:13px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{background:#35708a}
button.active{background:#168c69;border-color:#5cffbd}
#hud{position:absolute;top:10px;left:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none;z-index:5}
.stat{background:#14232be8;padding:9px 12px;border:1px solid #526773;border-radius:10px;font-weight:bold;font-size:13px}
#help{position:absolute;right:10px;top:10px;background:#14232be8;padding:10px;border-radius:9px;font-size:11px;line-height:1.7;pointer-events:none;z-index:5}
#message{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#14232bed;padding:11px 20px;border-radius:10px;display:none;z-index:20;white-space:nowrap;font-size:13px}
#crosshair{position:absolute;top:50%;left:50%;width:8px;height:8px;border:2px solid white;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);z-index:4}
#buildInfo{position:absolute;left:10px;bottom:105px;background:#14232be8;padding:9px;border-radius:9px;font-size:11px;z-index:5;pointer-events:none}
#bottom{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:96%;z-index:10}
#bottom button{font-size:12px;padding:10px}
#mine{background:#8b5722;border-color:#e3b16c;font-weight:bold}
#reset{position:absolute;right:10px;bottom:105px;z-index:10}
#stick{position:absolute;left:22px;bottom:120px;width:116px;height:116px;border-radius:50%;border:2px solid #d7e7efaa;background:#14232baa;z-index:9;touch-action:none}
#stick:after{content:"移動";position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:11px;color:#eaf6ff;pointer-events:none}
#knob{position:absolute;width:44px;height:44px;left:34px;top:44px;border-radius:50%;background:#8eb7c9e8;border:2px solid white;box-shadow:0 2px 9px #0008;pointer-events:none}
@media(max-width:700px){
 #help{top:65px;right:8px;font-size:10px;padding:7px}
 #hud{top:7px;left:7px;gap:4px}
 .stat{padding:7px 8px;font-size:11px}
 #bottom{bottom:5px;width:99%;gap:4px}
 #bottom button{font-size:10px;padding:9px 6px}
 #stick{left:12px;bottom:135px;width:105px;height:105px}
 #knob{left:29px;top:39px}
 #reset{right:8px;bottom:135px;padding:8px;font-size:10px}
 #buildInfo{bottom:95px;left:8px;font-size:10px}
}
</style>
</head>
<body>

<div id="hud">
 <div class="stat">💰 <span id="money">100</span>円</div>
 <div class="stat">⛏ 鉱石 <span id="ore">0</span></div>
 <div class="stat">📦 製品 <span id="product">0</span></div>
</div>

<div id="help">
 <b>操作方法</b><br>
 左下スティック：移動<br>
 画面ドラッグ：視点変更<br>
 E / 採掘長押し：採掘<br>
 R：設備・ベルト回転<br>
 タップ：設置
</div>

<div id="crosshair"></div>
<div id="message"></div>
<div id="buildInfo">建築モード：なし</div>

<div id="stick"><div id="knob"></div></div>

<div id="bottom">
 <button id="mine">⛏ 採掘（長押し）</button>
 <button id="sell">📦 鉱石を売る</button>
 <button data-build="belt">ベルト 20円</button>
 <button data-build="miner">採掘機 150円</button>
 <button data-build="crusher">粉砕機 180円</button>
 <button data-build="smelter">精錬機 250円</button>
 <button data-build="assembler">部品製造機 350円</button>
 <button data-build="seller">販売機 250円</button>
 <button id="cancel">解除</button>
</div>
<button id="reset">リセット</button>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

/* =========================
   基本シーン
========================= */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc5d9);
scene.fog=new THREE.Fog(0x9bc5d9,35,110);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x536b50,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(25,40,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=mat(0x52834b);
const concrete=mat(0x858b8d);
const metal=mat(0x67747b);
const dark=mat(0x28343b);
const gold=mat(0xd8a53d);
const green=mat(0x38b76c);
const beltMat=mat(0x292f35);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),grass);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const factoryFloor=new THREE.Mesh(new THREE.BoxGeometry(45,.2,45),concrete);
factoryFloor.position.y=0;
factoryFloor.receiveShadow=true;
scene.add(factoryFloor);

const grid=new THREE.GridHelper(45,45,0x53666c,0x68787b);
grid.position.y=.12;
scene.add(grid);

/* 木 */
for(let i=0;i<75;i++){
 const x=(Math.random()-.5)*110;
 const z=(Math.random()-.5)*110;
 if(Math.abs(x)<27&&Math.abs(z)<27)continue;
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.7,7),mat(0x65452e));
 trunk.position.set(x,.85,z);
 scene.add(trunk);
 const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.2,3,7),mat(0x28653b));
 leaves.position.set(x,2.8,z);
 scene.add(leaves);
}

/* =========================
   プレイヤー
========================= */
const player=new THREE.Group();
const skin=mat(0xf0c69e);
const shirt=mat(0x2778bb);
const pants=mat(0x263b65);
const shoes=mat(0x252a30);

const torso=new THREE.Mesh(new THREE.BoxGeometry(.65,.85,.38),shirt);
torso.position.y=1.15;
torso.castShadow=true;
player.add(torso);

const head=new THREE.Mesh(new THREE.BoxGeometry(.43,.48,.43),skin);
head.position.y=1.82;
head.castShadow=true;
player.add(head);

const hair=new THREE.Mesh(new THREE.BoxGeometry(.45,.14,.45),mat(0x493326));
hair.position.y=2.12;
player.add(hair);

for(const x of [-.105,.105]){
 const eye=new THREE.Mesh(new THREE.BoxGeometry(.045,.055,.025),mat(0x202020));
 eye.position.set(x,1.87,.222);
 player.add(eye);
}

const arms=[],legs=[];
for(const side of [-1,1]){
 const arm=new THREE.Group();
 arm.position.set(side*.43,1.45,0);
 const upper=new THREE.Mesh(new THREE.BoxGeometry(.2,.48,.22),shirt);
 upper.position.y=-.22;
 arm.add(upper);
 const hand=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.18),skin);
 hand.position.y=-.51;
 arm.add(hand);
 player.add(arm);
 arms.push(arm);

 const leg=new THREE.Group();
 leg.position.set(side*.18,.78,0);
 const legMesh=new THREE.Mesh(new THREE.BoxGeometry(.25,.55,.29),pants);
 legMesh.position.y=-.27;
 leg.add(legMesh);
 const foot=new THREE.Mesh(new THREE.BoxGeometry(.27,.15,.4),shoes);
 foot.position.set(0,-.56,.06);
 leg.add(foot);
 player.add(leg);
 legs.push(leg);
}
scene.add(player);
player.position.set(0,0,8);

/* =========================
   ゲームデータ
========================= */
let yaw=0,pitch=.35;
let money=100,ore=0,product=0;
let buildMode=null,rotation=0;
let machines=[],items=[];
let keys={};
let mineHeld=false,lastMine=0;
let messageTimer;
let walkTime=0;

const CELL=2;
const prices={
 belt:20,miner:150,crusher:180,
 smelter:250,assembler:350,seller:250
};
const names={
 belt:"ベルトコンベア",
 miner:"採掘機",
 crusher:"粉砕機",
 smelter:"精錬機",
 assembler:"部品製造機",
 seller:"販売機"
};

function msg(s){
 const el=document.getElementById("message");
 el.textContent=s;
 el.style.display="block";
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>el.style.display="none",1900);
}
function updateUI(){
 document.getElementById("money").textContent=Math.floor(money);
 document.getElementById("ore").textContent=ore;
 document.getElementById("product").textContent=product;
}
function cube(w,h,d,material,x,y,z,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}
function snap(v){return Math.round(v/CELL)*CELL;}
function dirFor(rot){
 return new THREE.Vector3(Math.sin(rot),0,Math.cos(rot));
}
function samePos(a,b){
 return Math.hypot(a.x-b.x,a.z-b.z)<.65;
}

/* =========================
   鉱床
========================= */
const deposits=[];
for(let i=0;i<5;i++){
 const x=-16+i*8,z=-12;
 const group=new THREE.Group();
 group.position.set(x,0,z);
 for(let j=0;j<8;j++){
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.5+Math.random()*.3,0),gold);
  rock.position.set((Math.random()-.5)*1.5,.3+Math.random()*.25,(Math.random()-.5)*1.5);
  rock.rotation.set(Math.random(),Math.random(),Math.random());
  rock.castShadow=true;
  group.add(rock);
 }
 scene.add(group);
 deposits.push({x,z,group});
}

/* 売却エリア */
const sellZone=new THREE.Group();
cube(3,.35,3,green,0,.2,0,sellZone);
cube(2,.7,.12,gold,0,1,-1.5,sellZone);
sellZone.position.set(0,0,15);
scene.add(sellZone);

function nearestDeposit(x=player.position.x,z=player.position.z){
 let best=null,dist=Infinity;
 for(const d of deposits){
  const n=Math.hypot(x-d.x,z-d.z);
  if(n<dist){dist=n;best=d;}
 }
 return dist<3.5?best:null;
}

/* 手動採掘も3秒 */
function mine(){
 if(Date.now()-lastMine<3000)return;
 lastMine=Date.now();
 if(!nearestDeposit()){
  msg("鉱床の近くに移動してください");
  return;
 }
 ore++;
 updateUI();
 msg("鉱石を採掘した！");
}
function sell(){
 if(ore<=0){msg("売却できる鉱石がありません");return;}
 if(Math.hypot(player.position.x,player.position.z-15)>4){
  msg("販売エリアに移動してください");
  return;
 }
 money+=ore*10;
 msg(ore+"個の鉱石を売却！ +"+ore*10+"円");
 ore=0;
 updateUI();
}

/* =========================
   方向矢印
========================= */
function makeArrow(color=0xffd34f){
 const g=new THREE.Group();
 const material=new THREE.MeshStandardMaterial({
  color,emissive:color,emissiveIntensity:.25
 });
 const shaft=new THREE.Mesh(new THREE.BoxGeometry(.13,.09,.72),material);
 shaft.position.z=.05;
 g.add(shaft);
 const tip=new THREE.Mesh(new THREE.ConeGeometry(.27,.48,4),material);
 tip.rotation.x=Math.PI/2;
 tip.position.z=.55;
 g.add(tip);
 return g;
}

/* =========================
   ベルト・機械モデル
========================= */
function createMachine(type,x,z,rot){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 g.rotation.y=rot;

 const forward=dirFor(rot);

 if(type==="belt"){
  cube(1.9,.2,1.9,beltMat,0,.2,0,g);
  cube(1.65,.08,1.65,metal,0,.35,0,g);

  const strips=[];
  for(let i=0;i<6;i++){
   const strip=cube(1.35,.045,.12,mat(0x89949b),0,.42,-.8+i*.32,g);
   strips.push(strip);
  }
  for(const side of [-1,1]){
   cube(.12,.2,1.7,metal,side*.82,.48,0,g);
  }
  const arrow=makeArrow(0xffd34f);
  arrow.position.y=.54;
  g.add(arrow);

  g.userData.strips=strips;
  g.userData.arrow=arrow;

 }else{
  /* 機械本体 */
  if(type==="miner"){
   cube(1.7,.5,1.7,dark,0,.4,0,g);
   cube(1.1,1.1,1.1,metal,0,1.15,0,g);
   cube(.7,.2,.7,gold,0,1.8,0,g);
   const drill=new THREE.Mesh(new THREE.CylinderGeometry(.12,.4,.8,8),gold);
   drill.position.set(0,2.2,0);
   g.add(drill);
   g.userData.drill=drill;
   cube(.6,.3,.2,gold,0,.65,.95,g);
  }
  if(type==="crusher"){
   cube(1.8,1.3,1.8,metal,0,.75,0,g);
   cube(1.1,.7,1.1,dark,0,1.65,0,g);
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,12),gold);
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(0,1.05,.95);
   g.add(wheel);
   g.userData.wheel=wheel;
  }
  if(type==="smelter"){
   cube(1.8,1.4,1.8,metal,0,.8,0,g);
   cube(1.1,.6,1.1,dark,0,1.8,0,g);
   cube(.65,.45,.15,new THREE.MeshStandardMaterial({
    color:0xff671c,emissive:0xff3900,emissiveIntensity:1
   }),0,.7,.93,g);
   cube(.45,1,.45,dark,.5,2,0,g);
  }
  if(type==="assembler"){
   cube(1.8,1.5,1.8,green,0,.85,0,g);
   cube(1.1,.25,1.1,dark,0,1.75,0,g);
   cube(.3,.8,.3,gold,-.55,1.45,0,g);
   cube(.3,.8,.3,gold,.55,1.45,0,g);
   cube(.9,.15,.9,metal,0,.25,0,g);
  }
  if(type==="seller"){
   cube(1.8,1.5,1.8,green,0,.8,0,g);
   cube(1.1,.5,.15,gold,0,1.8,.93,g);
   cube(.8,.1,.8,dark,0,.25,0,g);
   cube(.5,.5,.15,mat(0xefff8a),0,1.1,.94,g);
  }

  /* 投入口：黄色、排出口：緑 */
  const input=cube(.48,.35,.16,gold,0,.65,-1.02,g);
  const output=cube(.48,.35,.16,green,0,.65,1.02,g);
  input.userData.port="input";
  output.userData.port="output";

  const inLabel=makeArrow(0xffd34f);
  inLabel.rotation.y=Math.PI;
  inLabel.scale.set(.55,.55,.55);
  inLabel.position.set(0,.95,-1.05);
  g.add(inLabel);

  const outLabel=makeArrow(0x42ff9b);
  outLabel.scale.set(.55,.55,.55);
  outLabel.position.set(0,.95,1.05);
  g.add(outLabel);
 }

 scene.add(g);
 const obj={
  type,x,z,rot,group:g,
  progress:0,queue:[],outputCount:0
 };
 machines.push(obj);
 return obj;
}

function findBeltAt(x,z){
 return machines.find(m=>m.type==="belt"&&Math.hypot(m.x-x,m.z-z)<.7);
}
function getPort(m,which){
 const d=dirFor(m.rot);
 const sign=which==="output"?1:-1;
 return {
  x:m.x+d.x*2*sign,
  z:m.z+d.z*2*sign
 };
}

/* =========================
   建築プレビュー
========================= */
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

const ghost=new THREE.Group();
const ghostBase=new THREE.Mesh(
 new THREE.BoxGeometry(1.9,.12,1.9),
 new THREE.MeshBasicMaterial({color:0x35ffad,transparent:true,opacity:.25})
);
ghostBase.position.y=.2;
ghost.add(ghostBase);

const ghostArrow=makeArrow(0x35ffad);
ghostArrow.position.y=.5;
ghost.add(ghostArrow);
scene.add(ghost);
ghost.visible=false;

function chooseBuild(type){
 buildMode=type;
 rotation=0;
 ghost.visible=true;
 document.querySelectorAll("[data-build]").forEach(b=>
  b.classList.toggle("active",b.dataset.build===type)
 );
 document.getElementById("buildInfo").textContent=
  "建築："+names[type]+" / Rで方向変更";
}
function cancelBuild(){
 buildMode=null;
 ghost.visible=false;
 document.querySelectorAll("[data-build]").forEach(b=>b.classList.remove("active"));
 document.getElementById("buildInfo").textContent="建築モード：なし";
}
function getGroundPoint(){
 raycaster.setFromCamera(mouse,camera);
 const hit=raycaster.intersectObject(floor);
 return hit.length?hit[0].point:null;
}
function place(){
 if(!buildMode)return;
 const p=getGroundPoint();
 if(!p)return;

 const x=snap(p.x),z=snap(p.z);
 if(Math.abs(x)>21||Math.abs(z)>21){
  msg("建築エリアの外です");return;
 }
 if(money<prices[buildMode]){
  msg("お金が足りません");return;
 }
 if(machines.some(m=>Math.abs(m.x-x)<1.3&&Math.abs(m.z-z)<1.3)){
  msg("そこには設置できません");return;
 }

 money-=prices[buildMode];
 createMachine(buildMode,x,z,rotation);
 updateUI();
 msg(names[buildMode]+"を設置！");
}

/* =========================
   アイテム
========================= */
const itemColors={
 ore:0x9ba6b0,
 crushed:0xc0a77c,
 ingot:0xe4a83d,
 component:0x68b7b1,
 product:0x43d77d
};
const itemNames={
 ore:"鉱石",
 crushed:"粉砕鉱石",
 ingot:"金属インゴット",
 component:"部品",
 product:"完成品"
};

function spawnItem(x,z,type,belt=null){
 const material=mat(itemColors[type]||0xffffff);
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(.42,.42,.42),material);
 mesh.castShadow=true;
 scene.add(mesh);
 const item={
  mesh,x,z,type,
  belt:null,
  progress:0,
  life:0,
  flying:!belt,
  vx:0,vz:0,vy:0
 };
 items.push(item);
 if(belt)attachToBelt(item,belt);
 else mesh.position.set(x,.7,z);
 return item;
}
function attachToBelt(item,belt){
 item.belt=belt;
 item.progress=0;
 item.flying=false;
 item.x=belt.x;
 item.z=belt.z;
 item.mesh.position.set(item.x,.7,item.z);
}
function removeItem(item){
 scene.remove(item.mesh);
 const i=items.indexOf(item);
 if(i>=0)items.splice(i,1);
}

/* 出口の先にベルトがあれば、そこへ飛ばす */
function ejectFromMachine(m,type){
 const port=getPort(m,"output");
 const belt=findBeltAt(port.x,port.z);
 const item=spawnItem(
  m.x+dirFor(m.rot).x*1.15,
  m.z+dirFor(m.rot).z*1.15,
  type
 );
 const d=dirFor(m.rot);
 item.vx=d.x*3.5;
 item.vz=d.z*3.5;
 item.vy=2.4;
 item.targetBelt=belt||null;
}

/* 機械が受け付ける材料と加工結果 */
const recipes={
 crusher:{input:"ore",output:"crushed",time:3.5},
 smelter:{input:"crushed",output:"ingot",time:5},
 assembler:{input:"ingot",output:"component",time:5}
};

function tryMachineInput(item,x,z,travelDir){
 for(const m of machines){
  if(!recipes[m.type])continue;
  const d=dirFor(m.rot);
  const input=getPort(m,"input");

  /* 機械の投入口側から来たアイテムだけ受け入れる */
  const near=Math.hypot(x-m.x,z-m.z)<2.25;
  const faces=travelDir.x*d.x+travelDir.z*d.z>.55;
  const correct=item.type===recipes[m.type].input;

  if(near&&faces&&correct){
   m.queue.push(item.type);
   removeItem(item);
   return true;
  }
 }
 return false;
}

/* ベルト上のアイテムを運ぶ */
function updateBeltItem(item,dt){
 const belt=item.belt;
 if(!belt)return;

 const d=dirFor(belt.rot);
 item.progress+=dt*2.3;

 item.x=belt.x+d.x*item.progress;
 item.z=belt.z+d.z*item.progress;
 item.mesh.position.set(item.x,.7,item.z);

 if(item.progress>=2){
  const nextX=belt.x+d.x*2;
  const nextZ=belt.z+d.z*2;
  const nextBelt=findBeltAt(nextX,nextZ);

  if(nextBelt){
   attachToBelt(item,nextBelt);
   return;
  }

  if(tryMachineInput(item,nextX,nextZ,d)){
   return;
  }

  /* 行き先がなければベルトの先で止まる */
  item.progress=1.95;
  item.x=belt.x+d.x*1.95;
  item.z=belt.z+d.z*1.95;
  item.mesh.position.set(item.x,.7,item.z);
 }
}

/* 機械の処理 */
function updateMachines(dt){
 for(const m of machines){

  if(m.type==="miner"){
   m.progress+=dt;
   if(m.progress>=3){
    m.progress-=3;
    const deposit=nearestDeposit(m.x,m.z);
    if(deposit){
     ejectFromMachine(m,"ore");
    }
   }
   if(m.group.userData.drill){
    m.group.userData.drill.rotation.y+=dt*3;
   }
  }

  if(m.type==="crusher"||m.type==="smelter"||m.type==="assembler"){
   const recipe=recipes[m.type];

   if(!m.active&&m.queue.length){
    const next=m.queue.shift();
    if(next===recipe.input){
     m.active=true;
     m.progress=0;
    }
   }

   if(m.active){
    m.progress+=dt;
    if(m.progress>=recipe.time){
     m.progress=0;
     m.active=false;
     ejectFromMachine(m,recipe.output);
    }
   }

   if(m.type==="crusher"&&m.group.children[2]){
    m.group.userData.wheel.rotation.x+=dt*3;
   }
  }

  if(m.type==="seller"){
   /* ベルトから完成品が届いたら販売 */
   for(let i=items.length-1;i>=0;i--){
    const item=items[i];
    if(item.type==="product"&&Math.hypot(item.x-m.x,item.z-m.z)<1.2){
     removeItem(item);
     money+=25;
     product++;
     updateUI();
     msg("完成品を販売！ +25円");
    }
   }
  }
 }
}

/* アイテム全体 */
function updateItems(dt){
 for(let i=items.length-1;i>=0;i--){
  const item=items[i];
  item.life+=dt;

  if(item.belt){
   updateBeltItem(item,dt);
  }else if(item.flying){
   item.vy-=9.8*dt;
   item.x+=item.vx*dt;
   item.z+=item.vz*dt;
   let y=item.mesh.position.y+item.vy*dt;

   if(y<.7){
    y=.7;
    item.vy=0;
    item.vx*=.65;
    item.vz*=.65;
   }
   item.mesh.position.set(item.x,y,item.z);

   /* 飛んでいるアイテムがベルトに到着 */
   if(item.targetBelt&&Math.hypot(item.x-item.targetBelt.x,item.z-item.targetBelt.z)<.75){
    attachToBelt(item,item.targetBelt);
   }else{
    const nearby=findBeltAt(item.x,item.z);
    if(nearby&&Math.hypot(item.x-nearby.x,item.z-nearby.z)<.65){
     attachToBelt(item,nearby);
    }
   }
  }

  if(item.life>90)removeItem(item);
 }
}

/* =========================
   キーボード
========================= */
addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;
 if(k==="e"){
  mineHeld=true;
  e.preventDefault();
 }
 if(k==="r"&&buildMode){
  rotation+=Math.PI/2;

/* 採掘ボタン：文字選択なし */
const mineButton=document.getElementById("mine");
mineButton.addEventListener("pointerdown",e=>{

 mineHeld=true;

["pointerup","pointercancel","lostpointercapture"].forEach(type=>{

/* =========================
   左下の移動スティック
========================= */
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let stickPointer=null;
let stickX=0,stickY=0;
let moveX=0,moveY=0;

function resetStick(){
 stickPointer=null;
 moveX=0;
 moveY=0;
 knob.style.transform="translate(0px,0px)";
}
stick.addEventListener("pointerdown",e=>{
 e.preventDefault();
 e.stopPropagation();
 stickPointer=e.pointerId;
 stick.setPointerCapture(e.pointerId);
});
stick.addEventListener("pointermove",e=>{
 if(stickPointer!==e.pointerId)return;
 e.preventDefault();
 const r=stick.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;
 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 const max=r.width*.29;
 const len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 moveX=dx/max;
 moveY=dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
});
stick.addEventListener("pointerup",resetStick);
stick.addEventListener("pointercancel",resetStick);
stick.addEventListener("contextmenu",e=>e.preventDefault());

/* =========================
   画面ドラッグでカメラ
========================= */
let cameraPointer=null;
let lastX=0,lastY=0;
let startX=0,startY=0;
let moved=false;

function updateMouse(x,y){
 mouse.x=x/innerWidth*2-1;
 mouse.y=-(y/innerHeight)*2+1;
}
function overUI(target){
 return !!target.closest("button,#stick");
}
renderer.domElement.addEventListener("pointerdown",e=>{
 if(overUI(e.target))return;
 if(e.pointerType==="mouse"&&e.button!==0)return;
 cameraPointer=e.pointerId;
 lastX=startX=e.clientX;
 lastY=startY=e.clientY;
 moved=false;
 updateMouse(e.clientX,e.clientY);
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 updateMouse(e.clientX,e.clientY);
 if(cameraPointer!==e.pointerId)return;
 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;
 if(Math.hypot(e.clientX-startX,e.clientY-startY)>6)moved=true;
 if(moved){
  yaw-=dx*.006;
  pitch=THREE.MathUtils.clamp(pitch+dy*.004,-.2,1.1);
 }
 lastX=e.clientX;
 lastY=e.clientY;
});
renderer.domElement.addEventListener("pointerup",e=>{
 if(cameraPointer!==e.pointerId)return;
 if(!moved&&buildMode){
  updateMouse(e.clientX,e.clientY);
  place();
 }
 cameraPointer=null;
});
renderer.domElement.addEventListener("pointercancel",e=>{
 if(cameraPointer===e.pointerId)cameraPointer=null;
});
renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());

/* ダブルタップ拡大防止 */
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("touchmove",e=>{
 if(e.target===document.body||e.target===renderer.domElement)e.preventDefault();
},{passive:false});

/* =========================
   移動・カメラ・描画
========================= */
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 /* E・採掘ボタン長押し */
 if(mineHeld)mine();

 /* キーボードとスティックを合成 */
 let forward=0,side=0;
 if(keys.w||keys.arrowup)forward+=1;
 if(keys.s||keys.arrowdown)forward-=1;
 if(keys.a||keys.arrowleft)side-=1;
 if(keys.d||keys.arrowright)side+=1;

 forward+=-moveY;
 side+=moveX;

 forward=THREE.MathUtils.clamp(forward,-1,1);
 side=THREE.MathUtils.clamp(side,-1,1);

 /* カメラの向きに合わせた移動 */
 const direction=new THREE.Vector3(
  -Math.sin(yaw)*forward+Math.cos(yaw)*side,
  0,
  -Math.cos(yaw)*forward-Math.sin(yaw)*side
 );

 if(direction.length()>.05){
  direction.normalize();
  player.position.addScaledVector(direction,dt*6);
  player.rotation.y=Math.atan2(direction.x,direction.z);
  walkTime+=dt*10;
  legs[0].rotation.x=Math.sin(walkTime)*.55;
  legs[1].rotation.x=-Math.sin(walkTime)*.55;
  arms[0].rotation.x=-Math.sin(walkTime)*.35;
  arms[1].rotation.x=Math.sin(walkTime)*.35;
 }else{
  legs.forEach(l=>l.rotation.x=THREE.MathUtils.lerp(l.rotation.x,0,.2));
  arms.forEach(a=>a.rotation.x=THREE.MathUtils.lerp(a.rotation.x,0,.2));
 }

 player.position.x=THREE.MathUtils.clamp(player.position.x,-23,23);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-23,23);

 /* カメラ */
 const target=player.position.clone().add(new THREE.Vector3(0,1,0));
 const distance=8;
 const offset=new THREE.Vector3(
  Math.sin(yaw)*Math.cos(pitch)*distance,
  Math.sin(pitch)*distance+2,
  Math.cos(yaw)*Math.cos(pitch)*distance
 );
 camera.position.lerp(target.clone().add(offset),.12);
 camera.lookAt(target);

 /* 建築プレビュー */
 if(buildMode){
  const p=getGroundPoint();
  if(p){
   ghost.visible=true;
   ghost.position.set(snap(p.x),.3,snap(p.z));
   ghost.rotation.y=rotation;
   ghostArrow.visible=true;
  }
 }else{
  ghost.visible=false;
 }

 /* ベルトの動く板 */
 for(const m of machines){
  if(m.type==="belt"){
   const strips=m.group.userData.strips;
   for(let i=0;i<strips.length;i++){
    const strip=strips[i];
    let z=strip.position.z+dt*1.5;
    if(z>.85)z=-.85;
    strip.position.z=z;
   }
  }
 }

 updateMachines(dt);
 updateItems(dt);

 renderer.render(scene,camera);
}
animate();

/* =========================
   セーブ・ロード
========================= */
function save(){
 localStorage.setItem("factory_save",JSON.stringify({
  money,ore,product,
  machines:machines.map(m=>({
   type:m.type,x:m.x,z:m.z,rot:m.rot
  }))
 }));
}
function load(){
 try{
  const data=JSON.parse(localStorage.getItem("factory_save"));
  if(!data)return;
  money=data.money??100;
  ore=data.ore??0;
  product=data.product??0;
  for(const m of data.machines??[]){
   createMachine(m.type,m.x,m.z,m.rot);
  }
  updateUI();
 }catch(e){
  console.log("Save data error",e);
 }
}

load();
setInterval(save,3000);
updateUI();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
