
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FACTORY WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:absolute;top:15px;left:15px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
.stat{background:#14232be8;padding:12px 17px;border:1px solid #526773;border-radius:10px;font-weight:bold}
#bottom{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:95%}
button{background:#203744;color:white;border:1px solid #68818e;border-radius:8px;padding:12px 17px;font-size:14px;cursor:pointer}
button:hover{background:#35708a}
button.active{background:#168c69;border-color:#5cffbd}
#help{position:absolute;right:15px;top:15px;background:#14232be8;padding:13px;border-radius:9px;font-size:13px;line-height:1.8}
#message{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:#14232bed;padding:12px 25px;border-radius:10px;display:none}
#crosshair{position:absolute;top:50%;left:50%;width:8px;height:8px;border:2px solid white;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
#buildInfo{position:absolute;left:15px;bottom:90px;background:#14232be8;padding:12px;border-radius:9px;font-size:13px}
#reset{position:absolute;right:15px;bottom:15px}
</style>
</head>
<body>
<div id="hud">
 <div class="stat">💰 <span id="money">100</span>円</div>
 <div class="stat">⛏ 鉱石 <span id="ore">0</span></div>
 <div class="stat">📦 製品 <span id="product">0</span></div>
</div>
<div id="help">
 <b>操作方法</b><br>
 WASD / 矢印：移動<br>
 マウスドラッグ：視点<br>
 E：採掘・操作<br>
 R：設備回転<br>
 左クリック：設置
</div>
<div id="crosshair"></div>
<div id="message"></div>
<div id="buildInfo">建築モード：なし</div>
<div id="bottom">
 <button id="mine">⛏ 採掘</button>
 <button id="sell">📦 鉱石を売る</button>
 <button data-build="belt">ベルトコンベア 20円</button>
 <button data-build="miner">採掘機 150円</button>
 <button data-build="smelter">精錬機 200円</button>
 <button data-build="seller">販売機 250円</button>
 <button id="cancel">建築解除</button>
</div>
<button id="reset">リセット</button>
<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>
<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc5d9);
scene.fog=new THREE.Fog(0x9bc5d9,35,110);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x536b50,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(25,40,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x52834b);
const concrete=mat(0x858b8d);
const metal=mat(0x67747b);
const dark=mat(0x28343b);
const gold=mat(0xd8a53d);
const beltMat=mat(0x292f35);
const oreMat=mat(0x8a9099);
const green=mat(0x38b76c);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),grass);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

// 工場の床
const factoryFloor=new THREE.Mesh(new THREE.BoxGeometry(45,.2,45),concrete);
factoryFloor.position.set(0,.0,0);
factoryFloor.receiveShadow=true;
scene.add(factoryFloor);

const grid=new THREE.GridHelper(45,45,0x53666c,0x68787b);
grid.position.y=.12;
scene.add(grid);

// 外周の木
for(let i=0;i<75;i++){
 let x=(Math.random()-.5)*110;
 let z=(Math.random()-.5)*110;
 if(Math.abs(x)<27&&Math.abs(z)<27)continue;
 let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.7,7),mat(0x65452e));
 trunk.position.set(x,.85,z);
 scene.add(trunk);
 let leaves=new THREE.Mesh(new THREE.ConeGeometry(1.2,3,7),mat(0x28653b));
 leaves.position.set(x,2.8,z);
 scene.add(leaves);
}

// プレイヤー
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(.65,1,.4),mat(0x2778bb));
body.position.y=1;
body.castShadow=true;
player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),mat(0xf0c69e));
head.position.y=1.7;
player.add(head);
scene.add(player);
player.position.set(0,0,8);

let yaw=0,pitch=.35;
let money=100,ore=0,product=0;
let buildMode=null,rotation=0;
let machines=[],belts=[],items=[];
let keys={};
let mouseDown=false,lastX=0,lastY=0;
let lastMine=0;
let messageTimer;

const prices={belt:20,miner:150,smelter:200,seller:250};
const names={belt:"ベルトコンベア",miner:"採掘機",smelter:"精錬機",seller:"販売機"};

function msg(s){
 const el=document.getElementById("message");
 el.textContent=s;el.style.display="block";
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>el.style.display="none",1800);
}
function updateUI(){
 document.getElementById("money").textContent=Math.floor(money);
 document.getElementById("ore").textContent=ore;
 document.getElementById("product").textContent=product;
}
function cube(w,h,d,material,x,y,z,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}

// 鉱石鉱床
const deposits=[];
for(let i=0;i<5;i++){
 const x=-16+i*8,z=-12;
 const group=new THREE.Group();
 group.position.set(x,0,z);
 for(let j=0;j<8;j++){
  let rock=new THREE.Mesh(
   new THREE.DodecahedronGeometry(.5+Math.random()*.3,0),
   gold
  );
  rock.position.set((Math.random()-.5)*1.5,.3+Math.random()*.25,(Math.random()-.5)*1.5);
  rock.rotation.set(Math.random(),Math.random(),Math.random());
  rock.castShadow=true;group.add(rock);
 }
 scene.add(group);
 deposits.push({x,z,group});
}

// 初期の売却場所
const sellZone=new THREE.Group();
cube(3,.35,3,green,0,.2,15,sellZone);
const sign=cube(2,.7,.12,gold,0,1,13.5,sellZone);
sellZone.position.set(0,0,0);
scene.add(sellZone);

function nearestDeposit(){
 let best=null,dist=Infinity;
 for(const d of deposits){
  const n=Math.hypot(player.position.x-d.x,player.position.z-d.z);
  if(n<dist){dist=n;best=d;}
 }
 return dist<3?best:null;
}
function mine(){
 if(Date.now()-lastMine<500)return;
 lastMine=Date.now();
 if(!nearestDeposit()){
  msg("鉱床の近くに移動してください");
  return;
 }
 ore++;
 updateUI();
 msg("鉱石を採掘した！");
}
function sell(){
 if(ore<=0){msg("売却できる鉱石がありません");return;}
 if(Math.hypot(player.position.x,player.position.z-15)>4){
  msg("販売エリアに移動してください");return;
 }
 money+=ore*10;
 msg(ore+"個の鉱石を売却！ +"+ore*10+"円");
 ore=0;updateUI();
}

// 設備モデル
function createMachine(type,x,z,rot){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 g.rotation.y=rot;
 if(type==="belt"){
  cube(1.9,.2,1.9,beltMat,0,.2,0,g);
  cube(1.5,.08,1.5,metal,0,.35,0,g);
  for(let i=0;i<5;i++){
   let roller=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,1.45,12),metal);
   roller.rotation.z=Math.PI/2;
   roller.position.set(0,.45,-.65+i*.32);
   g.add(roller);
  }
  const arrow=cube(.12,.08,.7,gold,0,.48,0,g);
 }else if(type==="miner"){
  cube(1.7,.5,1.7,dark,0,.4,0,g);
  cube(1.1,1.1,1.1,metal,0,1.15,0,g);
  cube(.7,.2,.7,gold,0,1.8,0,g);
  const drill=new THREE.Mesh(new THREE.CylinderGeometry(.12,.4,.8,8),gold);
  drill.position.set(0,2.2,0);
  g.add(drill);g.userData.drill=drill;
 }else if(type==="smelter"){
  cube(1.8,1.4,1.8,metal,0,.8,0,g);
  cube(1.1,.6,1.1,dark,0,1.8,0,g);
  cube(.65,.45,.15,new THREE.MeshStandardMaterial({color:0xff671c,emissive:0xff3900,emissiveIntensity:1}),0,.7,-.93,g);
  const chimney=cube(.45,1,.45,dark,.5,2,0,g);
  g.userData.glow=true;
 }else if(type==="seller"){
  cube(1.8,1.5,1.8,green,0,.8,0,g);
  cube(1.1,.5,.15,gold,0,1.8,-.93,g);
  cube(.8,.1,.8,dark,0,.25,0,g);
 }
 scene.add(g);
 const obj={type,x,z,rot,group:g,progress:0};
 machines.push(obj);
 return obj;
}

// 建築
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const ghost=new THREE.Mesh(new THREE.BoxGeometry(2,.2,2),new THREE.MeshBasicMaterial({color:0x35ffad,transparent:true,opacity:.4}));
ghost.visible=false;
scene.add(ghost);

function chooseBuild(type){
 buildMode=type;
 rotation=0;
 ghost.visible=true;
 document.querySelectorAll("[data-build]").forEach(b=>b.classList.toggle("active",b.dataset.build===type));
 document.getElementById("buildInfo").textContent="建築モード："+names[type]+" / Rで回転";
}
function cancelBuild(){
 buildMode=null;ghost.visible=false;
 document.querySelectorAll("[data-build]").forEach(b=>b.classList.remove("active"));
 document.getElementById("buildInfo").textContent="建築モード：なし";
}
function getGroundPoint(){
 raycaster.setFromCamera(mouse,camera);
 const hit=raycaster.intersectObject(floor);
 if(!hit.length)return null;
 return hit[0].point;
}
function place(){
 if(!buildMode)return;
 const p=getGroundPoint();
 if(!p)return;
 const x=Math.round(p.x),z=Math.round(p.z);
 if(Math.abs(x)>21||Math.abs(z)>21){msg("建築エリアの外です");return;}
 if(money<prices[buildMode]){msg("お金が足りません");return;}
 if(machines.some(m=>Math.abs(m.x-x)<1.7&&Math.abs(m.z-z)<1.7)){msg("そこには設置できません");return;}
 money-=prices[buildMode];
 createMachine(buildMode,x,z,rotation);
 updateUI();
 msg(names[buildMode]+"を設置！");
}

// 入力
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="e"){
  mine();
 }
 if(e.key.toLowerCase()==="r"&&buildMode){
  rotation+=Math.PI/2;
  ghost.rotation.y=rotation;
 }
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("mousemove",e=>{
 mouse.x=e.clientX/innerWidth*2-1;
 mouse.y=-(e.clientY/innerHeight)*2+1;
 if(mouseDown){
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  yaw-=dx*.005;
  pitch=Math.max(-.2,Math.min(1.1,pitch+dy*.003));
 }
 lastX=e.clientX;lastY=e.clientY;
});
addEventListener("mousedown",e=>{mouseDown=true;});
addEventListener("mouseup",e=>{
 if(mouseDown&&buildMode)place();
 mouseDown=false;
});
addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("wheel",e=>{
 camera.position.addScaledVector(camera.getWorldDirection(new THREE.Vector3()),e.deltaY*.008);
});

document.getElementById("mine").onclick=mine;
document.getElementById("sell").onclick=sell;
document.getElementById("cancel").onclick=cancelBuild;
document.querySelectorAll("[data-build]").forEach(b=>{
 b.onclick=()=>chooseBuild(b.dataset.build);
});
document.getElementById("reset").onclick=()=>{
 if(confirm("本当に最初からやり直しますか？")){
  location.reload();
 }
};

// 自動生産
function spawnItem(x,z,type){
 const m=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,.35),type==="product"?green:gold);
 m.position.set(x,.7,z);
 m.castShadow=true;
 scene.add(m);
 items.push({mesh:m,x,z,life:0,type});
}
let autoTimer=0;
function simulate(dt){
 autoTimer+=dt;
 for(const m of machines){
  if(m.type==="miner"){
   m.progress+=dt;
   if(m.userData){}
   if(m.progress>4){
    m.progress=0;
    spawnItem(m.x,m.z,"ore");
   }
   if(m.group.userData.drill){
    m.group.userData.drill.rotation.y+=dt*2;
   }
  }
  if(m.type==="smelter"){
   m.progress+=dt;
   if(m.progress>6){
    m.progress=0;
    const item=items.find(i=>i.type==="ore"&&Math.hypot(i.x-m.x,i.z-m.z)<3);
    if(item){
     scene.remove(item.mesh);
     items.splice(items.indexOf(item),1);
     spawnItem(m.x,m.z,"product");
    }
   }
  }
  if(m.type==="seller"){
   const item=items.find(i=>Math.hypot(i.x-m.x,i.z-m.z)<2);
   if(item){
    scene.remove(item.mesh);
    items.splice(items.indexOf(item),1);
    money+=25;
    product++;
    updateUI();
   }
  }
 }
 // ベルトがある場所では資源が移動
 for(const item of items){
  item.life+=dt;
  const belt=belts.find(b=>Math.hypot(b.x-item.x,b.z-item.z)<1.3);
  const beltMachine=machines.find(m=>m.type==="belt"&&Math.hypot(m.x-item.x,m.z-item.z)<1.3);
  if(beltMachine){
   const dir=new THREE.Vector3(Math.sin(beltMachine.rot),0,Math.cos(beltMachine.rot));
   item.x+=dir.x*dt*1.7;
   item.z+=dir.z*dt*1.7;
   item.mesh.position.set(item.x,.7,item.z);
  }
  if(item.life>45){
   scene.remove(item.mesh);
   items.splice(items.indexOf(item),1);
  }
 }
}

// 移動とカメラ
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 let forward=0,side=0;
 if(keys.w||keys.arrowup)forward=1;
 if(keys.s||keys.arrowdown)forward=-1;
 if(keys.a||keys.arrowleft)side=-1;
 if(keys.d||keys.arrowright)side=1;
 const direction=new THREE.Vector3(
  Math.sin(yaw)*forward+Math.cos(yaw)*side,
  0,
  Math.cos(yaw)*forward-Math.sin(yaw)*side
 );
 if(direction.length()>0){
  direction.normalize();
  player.position.addScaledVector(direction,dt*6);
  player.rotation.y=Math.atan2(direction.x,direction.z);
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-23,23);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-23,23);

 const target=player.position.clone().add(new THREE.Vector3(0,1,0));
 const distance=8;
 const camOffset=new THREE.Vector3(
  Math.sin(yaw)*Math.cos(pitch)*distance,
  Math.sin(pitch)*distance+2,
  Math.cos(yaw)*Math.cos(pitch)*distance
 );
 camera.position.lerp(target.clone().add(camOffset),.12);
 camera.lookAt(target);

 if(buildMode){
  const p=getGroundPoint();
  if(p){
   ghost.visible=true;
   ghost.position.set(Math.round(p.x),.3,Math.round(p.z));
   ghost.rotation.y=rotation;
  }
 }else ghost.visible=false;

 simulate(dt);
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

// セーブ
function save(){
 localStorage.setItem("factory_save",JSON.stringify({
  money,ore,product,
  machines:machines.map(m=>({type:m.type,x:m.x,z:m.z,rot:m.rot}))
 }));
}
function load(){
 try{
  const data=JSON.parse(localStorage.getItem("factory_save"));
  if(!data)return;
  money=data.money??100;ore=data.ore??0;product=data.product??0;
  for(const m of data.machines??[]){
   createMachine(m.type,m.x,m.z,m.rot);
  }
  updateUI();
 }catch(e){console.log("Save data error",e);}
}
load();
setInterval(save,3000);
updateUI();
</script>
</body>
</html>
